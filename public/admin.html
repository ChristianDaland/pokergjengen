<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Poker - Admin Kontrollpanel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1, h2, h3 { color: #f0883e; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card-panel {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover { opacity: 0.9; }
        button.success { background-color: #28a745; }
        button.warning { background-color: #ffc107; color: #000; }
        button.danger { background-color: #dc3545; }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px; background: #333; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<h1>🎛️ Spillleder Kontrollpanel (Admin)</h1>

<div class="grid">
    <!-- Panel 1: Spillinnstillinger -->
    <div class="card-panel">
        <h2>1. Spillinnstillinger</h2>
        <label for="gameTypeSelect">Velg Spilltype:</label>
        <select id="gameTypeSelect" onchange="updateGameType()">
            <option value="Texas Hold'em">Texas Hold'em (2 kort)</option>
            <option value="Omaha Poker">Omaha Poker (4 kort)</option>
            <option value="5-Card Omaha">5-Card Omaha (5 kort)</option>
            <option value="Courchevel">Courchevel</option>
        </select>

        <button class="success" onclick="startNewRound()">♠️ Start Ny Runde (Del ut kort)</button>
    </div>

    <!-- Panel 2: Felleskort & Runde-styring -->
    <div class="card-panel">
        <h2>2. Felleskort (Board)</h2>
        <button class="warning" onclick="dealCommunity(3)">Del Flop (3 kort)</button>
        <button class="warning" onclick="dealCommunity(1)">Del Turn / River (1 kort)</button>
        
        <hr style="border-color:#444; margin: 15px 0;">

        <button class="danger" onclick="triggerShowdown()">🏆 Kjør Showdown / Avslutt Runde</button>
    </div>

    <!-- Panel 3: Status & Spillere -->
    <div class="card-panel">
        <h2>3. Bordstatus</h2>
        <p><strong>Aktivt spill:</strong> <span id="currentGameType">-</span></p>
        <p><strong>Pott:</strong> <span id="currentPot">0</span> pt</p>
        <p><strong>Felleskort spilt:</strong> <span id="currentCommunity">-</span></p>
        
        <h3>Tilkoblede Spillere (<span id="playerCount">0</span>)</h3>
        <ul id="adminPlayersList"></ul>
    </div>
</div>

<script>
    const socket = io();

    function updateGameType() {
        const selectedType = document.getElementById('gameTypeSelect').value;
        socket.emit('update_settings', { gameType: selectedType });
    }

    function startNewRound() {
        socket.emit('start_round');
    }

    function dealCommunity(count) {
        socket.emit('deal_community', count);
    }

    function triggerShowdown() {
        if (confirm("Er du sikker på at du vil avslutte runden og beregne vinner?")) {
            socket.emit('showdown');
        }
    }

    socket.on('state_update', (state) => {
        document.getElementById('currentGameType').innerText = state.gameType;
        document.getElementById('currentPot').innerText = state.pot;
        document.getElementById('gameTypeSelect').value = state.gameType;

        const cardsText = state.communityCards.map(c => `${c.value}${c.suit}`).join(' ') || 'Ingen';
        document.getElementById('currentCommunity').innerText = cardsText;

        const playersList = document.getElementById('adminPlayersList');
        document.getElementById('playerCount').innerText = state.players.length;
        playersList.innerHTML = '';
        
        state.players.forEach(p => {
            const li = document.createElement('li');
            li.innerHTML = `<span><strong>${p.name}</strong></span> <span>${p.folded ? '<span style="color:#dc3545;">(Folded)</span>' : '<span style="color:#28a745;">(Aktiv)</span>'}</span>`;
            playersList.appendChild(li);
        });
    });
</script>
</body>
</html>
