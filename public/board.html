<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker – Storskjerm</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background-color: #1b4332; color: white; margin: 0; padding: 20px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }

    .header { text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; font-size: 1.3rem; }
    .community-cards { display: flex; gap: 15px; justify-content: center; min-height: 120px; margin: 20px 0; }
    .card { background: white; color: black; border-radius: 8px; width: 80px; height: 120px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; }
    
    /* Spillerboks med RØDT KRYSS (❌) */
    .player-box { position: relative; background: rgba(8, 28, 21, 0.85); border: 3px solid #52b788; border-radius: 16px; padding: 20px; text-align: center; }
    .player-box.eliminated { border-color: #d9534f; opacity: 0.6; }
    .player-box.eliminated::after { content: '❌'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; color: #d9534f; pointer-events: none; }
  </style>
</head>
<body>

  <div class="header">
    🏠 Vert: <b id="host-display">Odd Christian</b> | Omgang: <b id="round-display">1</b>
  </div>

  <div style="text-align: center;">
    <h2>FELLESKORT</h2>
    <div id="community-cards" class="community-cards"></div>
  </div>

  <div id="players-grid" class="players-grid"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('session_update', (s) => {
      document.getElementById('host-display').innerText = s.host;
      document.getElementById('round-display').innerText = s.round;
    });

    socket.on('game_state', (state) => {
      // Felleskort
      document.getElementById('community-cards').innerHTML = state.communityCards.map(c => `
        <div class="card">${c}</div>
      `).join('');

      // Spillere med rødt kryss
      document.getElementById('players-grid').innerHTML = state.players.map(p => `
        <div class="player-box ${p.eliminated ? 'eliminated' : ''}">
          <h2 style="margin: 0;">${p.name}</h2>
          <div style="color: #ffd700; margin-top: 10px; font-size: 1.2rem;">Poeng: ${p.totalPoints}</div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
