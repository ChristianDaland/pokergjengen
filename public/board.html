<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordskjerm</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #1b4332;
      color: white;
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .info-header {
      background: #081c15;
      padding: 10px 30px;
      border-radius: 20px;
      font-size: 1.4rem;
      border: 2px solid #52b788;
    }

    .community-area {
      text-align: center;
    }

    .cards-row {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 15px;
      min-height: 120px;
    }

    .card {
      background: white;
      border-radius: 10px;
      width: 80px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      font-weight: bold;
      color: black;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .card.red { color: #d9534f; }
    .card-val { font-size: 1.5rem; line-height: 1; }
    .card-suit { font-size: 2rem; line-height: 1; }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .player-box {
      background: rgba(8, 28, 21, 0.8);
      border: 3px solid #52b788;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="info-header">
    <span id="game-mode">Texas Hold'em</span> | Vert: <b id="host-name">Odd Christian</b>
  </div>

  <div class="community-area">
    <h2>FELLESKORT</h2>
    <div id="community-cards" class="cards-row"></div>
  </div>

  <div id="players-container" class="players-grid"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function formatCard(cardCode) {
      if (!cardCode) return '';
      let rawVal = cardCode.slice(0, -1).toUpperCase();
      let displayVal = rawVal === 'T' ? '10' : rawVal;
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };

      return `
        <div class="card ${suit.color}">
          <div class="card-val">${displayVal}</div>
          <div class="card-suit">${suit.symbol}</div>
        </div>
      `;
    }

    socket.on('game_state', (state) => {
      document.getElementById('game-mode').innerText = state.mode || "Texas Hold'em";
      document.getElementById('host-name').innerText = state.host || "Odd Christian";

      // Felleskort
      const boardDiv = document.getElementById('community-cards');
      boardDiv.innerHTML = (state.communityCards || []).map(c => formatCard(c)).join('');

      // Spillere
      const playersDiv = document.getElementById('players-container');
      playersDiv.innerHTML = (state.players || []).map(p => `
        <div class="player-box">
          <h3 style="margin: 0 0 10px 0;">${p.name}</h3>
          <div style="color: #ffd700;">Poeng: ${p.points || 0}</div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
