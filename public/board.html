<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Poker</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: 600;
        }

        .menu-btn {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card-box {
            background-color: #1e1e1e;
            border-radius: 6px;
            padding: 20px;
            border: 1px solid #2d2d2d;
        }

        .card-box h2 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .info-group {
            margin-bottom: 12px;
            font-size: 1rem;
            line-height: 1.4;
        }

        .info-label {
            color: #ffffff;
            font-weight: normal;
        }

        .tab-buttons {
            display: flex;
            gap: 2px;
            margin-bottom: 15px;
        }

        .tab-btn {
            background-color: #2c2c2c;
            color: #ffffff;
            border: none;
            padding: 4px 10px;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 2px;
        }

        .tab-btn.active {
            background-color: #444444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 8px;
            background-color: #2a2a2a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.95rem;
        }

        .cards-list {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .playing-card {
            background: #fff;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .playing-card.red { color: #d9534f; }
    </style>
</head>
<body>

<div class="header">
    <h1>Hybrid Poker</h1>
    <button class="menu-btn">Meny ☰</button>
</div>

<div class="main-container">
    <!-- Aktivt Spill -->
    <div class="card-box">
        <h2>Aktivt Spill</h2>
        
        <div class="info-group">
            <span class="info-label">Spilltype:</span> <span id="gameType">Texas Hold'em</span><br>
            <span class="info-label">Pott:</span> <span id="potAmount">0</span> pt
        </div>

        <div class="info-group">
            <strong style="display:block; margin-bottom: 4px;">Felleskort</strong>
            <div id="communityCardsContainer">Ingen kort på bordet</div>
        </div>

        <div class="info-group" style="margin-top: 15px;">
            <strong style="display:block; margin-bottom: 4px;">Spillere ved bordet</strong>
            <div id="playersList">Ingen spillere tilkoblet</div>
        </div>
    </div>

    <!-- Topp 10 -->
    <div class="card-box">
        <h2>Topp 10</h2>
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="loadTop10('tonight', this)">Kveldens</button>
            <button class="tab-btn" onclick="loadTop10('total', this)">Totalt</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Spiller</th>
                    <th>Poeng</th>
                    <th>Seire</th>
                </tr>
            </thead>
            <tbody id="top10Body">
                <!-- Fylles dynamisk -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const socket = io();
    let currentPeriod = 'tonight';

    function loadTop10(period, btn) {
        currentPeriod = period;
        if (btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        socket.emit('get_top10', { period: period });
    }

    socket.on('state_update', (state) => {
        document.getElementById('gameType').innerText = state.gameType || "Texas Hold'em";
        document.getElementById('potAmount').innerText = state.pot || 0;

        // Felleskort
        const cardsContainer = document.getElementById('communityCardsContainer');
        if (state.communityCards && state.communityCards.length > 0) {
            cardsContainer.innerHTML = '<div class="cards-list">' + 
                state.communityCards.map(c => {
                    const isRed = c.suit === '♥' || c.suit === '♦';
                    return `<span class="playing-card ${isRed ? 'red' : ''}">${c.value}${c.suit}</span>`;
                }).join('') + '</div>';
        } else {
            cardsContainer.innerText = 'Ingen kort på bordet';
        }

        // Spillere
        const playersContainer = document.getElementById('playersList');
        if (state.players && state.players.length > 0) {
            playersContainer.innerHTML = state.players.map(p => 
                `<div>${p.name} ${p.folded ? '<small style="color:#888;">(Folded)</small>' : ''}</div>`
            ).join('');
        } else {
            playersContainer.innerText = 'Ingen spillere tilkoblet';
        }
    });

    socket.on('top10_data', (data) => {
        const tbody = document.getElementById('top10Body');
        tbody.innerHTML = '';
        if (data && data.length > 0) {
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.player}</td><td>${row.total_points}</td><td>${row.wins}</td>`;
                tbody.appendChild(tr);
            });
        }
    });

    // Hent kveldens liste ved start
    loadTop10('tonight');
</script>

</body>
</html>
