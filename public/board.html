<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Poker - Bordskjerm</title>
  <!-- Bibliotek for generering av QR-kode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #1b4d2e;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .zoom-controls {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      z-index: 10;
    }
    .zoom-btn {
      background: #1e88e5;
      color: white;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }

    /* QR-seksjon */
    #qr-section {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    }
    #qrcode {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin: 20px 0;
    }

    /* Bordvisning */
    .board-wrapper {
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }
    .cards-container {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      width: 780px;
    }
    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border-radius: 12px;
      width: 140px;
      height: 195px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      font-weight: bold;
      position: relative;
      flex-shrink: 0;
    }
    .card.red { color: #d9534f; }
    .card.black { color: #222222; }

    .card-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }
    .card-corner.top-left { top: 10px; left: 10px; }
    .card-corner.bottom-right { bottom: 10px; right: 10px; transform: rotate(180deg); }
    .card-corner .val { font-size: 1.5rem; font-weight: bold; }
    .card-corner .suit { font-size: 1.2rem; margin-top: 2px; }

    .card-center-graphic {
      width: 80px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="zoom-controls">
    <span>Størrelse:</span>
    <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
    <span id="zoom-val">100%</span>
    <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
  </div>

  <!-- Fase 1: QR Kode for å logge inn på mobil -->
  <div id="qr-section">
    <h1 style="color: #ffd700; margin: 0;">♠️ Løland Poker ♥️</h1>
    <p style="color: #cbd5e1; font-size: 1.2rem; margin-top: 5px;">Skann med mobilen for å bli med på spillet:</p>
    <div id="qrcode"></div>
    <div id="mobile-url-text" style="color: #38bdf8; font-weight: bold; font-size: 1.1rem;"></div>
  </div>

  <!-- Fase 2: Selve kortbordet -->
  <div id="board-wrapper" class="board-wrapper" style="display: none;">
    <div id="board-cards" class="cards-container"></div>
  </div>

  <script>
    const socket = io();

    // Generer QR-kode til mobil.html basert på nåværende domene
    const mobileUrl = window.location.origin + '/mobile.html';
    document.getElementById('mobile-url-text').innerText = mobileUrl;
    new QRCode(document.getElementById("qrcode"), {
      text: mobileUrl,
      width: 220,
      height: 220
    });

    let currentScale = parseFloat(localStorage.getItem('board_zoom')) || 1.0;
    function applyZoom() {
      document.getElementById('board-wrapper').style.transform = `scale(${currentScale})`;
      document.getElementById('zoom-val').innerText = `${Math.round(currentScale * 100)}%`;
      localStorage.setItem('board_zoom', currentScale);
    }
    function adjustZoom(delta) {
      currentScale = Math.min(Math.max(0.5, currentScale + delta), 2.5);
      applyZoom();
    }
    applyZoom();

    function formatCard(cardCode) {
      if (!cardCode) return '';
      let rawVal = cardCode.slice(0, -1).toUpperCase();
      let displayVal = rawVal === 'T' ? '10' : rawVal;
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };

      return `
        <div class="card ${suit.color}">
          <div class="card-corner top-left">
            <span class="val">${displayVal}</span>
            <span class="suit">${suit.symbol}</span>
          </div>
          <div class="card-center-graphic" style="font-size: 3rem;">
            ${suit.symbol}
          </div>
          <div class="card-corner bottom-right">
            <span class="val">${displayVal}</span>
            <span class="suit">${suit.symbol}</span>
          </div>
        </div>
      `;
    }

    socket.on('state_update', (state) => {
      const qrSection = document.getElementById('qr-section');
      const boardWrapper = document.getElementById('board-wrapper');

      if (state.sessionStarted) {
        qrSection.style.display = 'none';
        boardWrapper.style.display = 'block';

        const boardContainer = document.getElementById('board-cards');
        const newBoard = state.board || [];
        boardContainer.innerHTML = newBoard.map(cardCode => formatCard(cardCode)).join('');
      } else {
        qrSection.style.display = 'flex';
        boardWrapper.style.display = 'none';
      }
    });
  </script>
</body>
</html>
