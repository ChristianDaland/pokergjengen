<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordskjerm</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #1b4332;
      color: white;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .board-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0,0,0,0.2);
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #081c15;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .zoom-btn {
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-btn {
      background: #0288d1;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .table-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .info-bar {
      background: rgba(8, 28, 21, 0.8);
      border: 2px solid #52b788;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 1.2rem;
    }

    .community-cards-area {
      text-align: center;
    }

    .community-cards-area h2 {
      margin: 0 0 10px 0;
      font-size: 1.3rem;
      color: #b7e4c7;
      letter-spacing: 1px;
    }

    :root {
      --card-scale: 1;
    }

    .cards-row {
      display: flex;
      gap: calc(14px * var(--card-scale));
      justify-content: center;
      align-items: center;
      min-height: calc(150px * var(--card-scale));
    }

    /* KORT DESIGN OG ANIMASJON */
    .card {
      background: white;
      border-radius: calc(8px * var(--card-scale));
      width: calc(100px * var(--card-scale));
      height: calc(145px * var(--card-scale));
      position: relative;
      padding: calc(6px * var(--card-scale));
      font-weight: bold;
      color: black;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      user-select: none;
      animation: flipIn 0.4s ease-out forwards;
    }

    @keyframes flipIn {
      0% { transform: scale(0.5) rotateY(90deg); opacity: 0; }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }

    .card.red { color: #d9534f; }

    /* Hjørnesymboler */
    .card-corner {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.95;
      font-size: calc(1.1rem * var(--card-scale));
    }

    .card-corner.top-left {
      top: calc(6px * var(--card-scale));
      left: calc(6px * var(--card-scale));
    }

    .card-corner.bottom-right {
      bottom: calc(6px * var(--card-scale));
      right: calc(6px * var(--card-scale));
      transform: rotate(180deg);
    }

    /* Symmetrisk Grid for Midten */
    .card-center-grid {
      position: absolute;
      top: calc(24px * var(--card-scale));
      bottom: calc(24px * var(--card-scale));
      left: calc(22px * var(--card-scale));
      right: calc(22px * var(--card-scale));
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      justify-items: center;
    }

    .pip-item {
      font-size: calc(1.3rem * var(--card-scale));
      line-height: 1;
    }

    .pip-item.inverted {
      transform: rotate(180deg);
    }

    .pip-item.center-single {
      grid-column: 1 / span 2;
    }

    /* Bildekort */
    .face-card-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: calc(3.2rem * var(--card-scale));
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1400px;
    }

    .player-box {
      background: rgba(8, 28, 21, 0.85);
      border: 3px solid #52b788;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="board-header">
    <div class="zoom-controls">
      <span>Kortstørrelse:</span>
      <button class="zoom-btn" onclick="adjustZoom(-0.1)">-</button>
      <span id="zoom-level">100%</span>
      <button class="zoom-btn" onclick="adjustZoom(0.1)">+</button>
      <button class="reset-btn" onclick="resetZoom()">Nullstill</button>
    </div>
  </div>

  <div class="table-container">
    <div class="info-bar">
      <span>🏠 Vert: <b id="display-host">Odd Christian</b></span>
    </div>

    <div class="community-cards-area">
      <h2>FELLESKORT (BOARD)</h2>
      <div id="community-cards" class="cards-row"></div>
    </div>

    <div id="players-container" class="players-grid"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentScale = 1.0;

    function adjustZoom(delta) {
      currentScale = Math.max(0.6, Math.min(2.0, currentScale + delta));
      document.documentElement.style.setProperty('--card-scale', currentScale);
      document.getElementById('zoom-level').innerText = Math.round(currentScale * 100) + '%';
    }

    function resetZoom() {
      currentScale = 1.0;
      document.documentElement.style.setProperty('--card-scale', currentScale);
      document.getElementById('zoom-level').innerText = '100%';
    }

    function formatCard(cardCode) {
      if (!cardCode) return '';
      let rawVal = cardCode.slice(0, -1).toUpperCase();
      let displayVal = rawVal === 'T' ? '10' : rawVal;
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };

      let centerContent = '';
      const numPips = parseInt(displayVal, 10);

      if (!isNaN(numPips)) {
        let pipsMarkup = '';
        let half = Math.floor(numPips / 2);
        
        // Symmetrisk topp-halvdel
        for (let i = 0; i < half; i++) {
          pipsMarkup += `<div class="pip-item">${suit.symbol}</div>`;
        }

        // Oddetalls-symbol i midten dersom tallet er 3, 5, 7, 9
        if (numPips % 2 !== 0) {
          pipsMarkup += `<div class="pip-item center-single">${suit.symbol}</div>`;
        }

        // Symmetrisk bunn-halvdel (opp-ned)
        for (let i = 0; i < half; i++) {
          pipsMarkup += `<div class="pip-item inverted">${suit.symbol}</div>`;
        }

        centerContent = `<div class="card-center-grid">${pipsMarkup}</div>`;
      } else {
        let faceIcon = suit.symbol;
        if (displayVal === 'J') faceIcon = '⚔️';
        if (displayVal === 'Q') faceIcon = '👑';
        if (displayVal === 'K') faceIcon = '♚';
        if (displayVal === 'A') faceIcon = suit.symbol;

        centerContent = `<div class="face-card-container">${faceIcon}</div>`;
      }

      return `
        <div class="card ${suit.color}">
          <div class="card-corner top-left">
            <div>${displayVal}</div>
            <div>${suit.symbol}</div>
          </div>
          ${centerContent}
          <div class="card-corner bottom-right">
            <div>${displayVal}</div>
            <div>${suit.symbol}</div>
          </div>
        </div>
      `;
    }

    socket.on('game_state', (state) => {
      if (state.host) {
        document.getElementById('display-host').innerText = state.host;
      }

      const boardDiv = document.getElementById('community-cards');
      boardDiv.innerHTML = (state.communityCards || []).map(c => formatCard(c)).join('');

      const playersDiv = document.getElementById('players-container');
      if (!state.players || state.players.length === 0) {
        playersDiv.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #aaa; font-size: 1.2rem;">Venter på at spillere skal koble seg til...</div>';
      } else {
        playersDiv.innerHTML = state.players.map(p => `
          <div class="player-box">
            <div class="player-name" style="font-size: 1.4rem; font-weight: bold;">${p.name}</div>
            <div style="color: #ffd700; margin-top: 5px;">Poeng: ${p.points || 0}</div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
