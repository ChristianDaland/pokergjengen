<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Poker - Bordvisning (Board)</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        header h1 { margin: 0; font-size: 2.5rem; color: #58a6ff; }
        header p { margin: 5px 0 0 0; color: #8b949e; font-size: 1.2rem; }
        
        .main-layout {
            display: flex;
            flex: 1;
            gap: 20px;
        }
        
        .poker-table {
            flex: 3;
            background: #161b22;
            border: 4px solid #30363d;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .pot-display {
            font-size: 2.2rem;
            background: #21262d;
            padding: 15px 30px;
            border-radius: 50px;
            border: 2px solid #238636;
            color: #3fb950;
            font-weight: bold;
        }

        .community-cards {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .card {
            width: 90px;
            height: 130px;
            background: #ffffff;
            color: #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .card.red { color: #d73a49; }

        .players-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .player-badge {
            background: #21262d;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            border: 1px solid #30363d;
        }

        .player-badge.folded {
            opacity: 0.4;
            text-decoration: line-through;
            border-color: #d73a49;
        }

        .sidebar {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }

        .sidebar h2 { margin-top: 0; color: #f0883e; font-size: 1.5rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #21262d; }
        th { color: #8b949e; }
        
        .winner-banner {
            display: none;
            background: #238636;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.8rem;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<header>
    <h1>Hybrid Poker</h1>
    <p>Spilltype: <strong id="gameTypeDisplay">-</strong></p>
</header>

<div id="winnerBanner" class="winner-banner"></div>

<div class="main-layout">
    <div class="poker-table">
        <div class="pot-display">Pott: <span id="potDisplay">0</span> pt</div>

        <div>
            <h3 style="text-align: center; color: #8b949e;">FELLESKORT</h3>
            <div class="community-cards" id="communityCards">
                <div class="card" style="background: #21262d; border: 1px dashed #484f58; color:#484f58;">?</div>
            </div>
        </div>

        <div style="width: 100%;">
            <h3 style="text-align: center; color: #8b949e; margin-bottom: 10px;">SPILLERE VED BORDET</h3>
            <div class="players-grid" id="playersGrid"></div>
        </div>
    </div>

    <div class="sidebar">
        <h2>🏆 Kveldens Topp 10</h2>
        <table id="top10Table">
            <thead>
                <tr>
                    <th>Spiller</th>
                    <th>Poeng</th>
                    <th>Seire</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const socket = io();

    socket.on('state_update', (state) => {
        document.getElementById('gameTypeDisplay').innerText = state.gameType;
        document.getElementById('potDisplay').innerText = state.pot;

        // Rendring av felleskort
        const cardsContainer = document.getElementById('communityCards');
        cardsContainer.innerHTML = '';
        if (state.communityCards && state.communityCards.length > 0) {
            state.communityCards.forEach(c => {
                const cardDiv = document.createElement('div');
                const isRed = c.suit === '♥' || c.suit === '♦';
                cardDiv.className = `card ${isRed ? 'red' : ''}`;
                cardDiv.innerText = `${c.value}${c.suit}`;
                cardsContainer.appendChild(cardDiv);
            });
        } else {
            cardsContainer.innerHTML = '<div class="card" style="background: #21262d; border: 1px dashed #484f58; color:#484f58;">?</div>';
        }

        // Rendring av spillere
        const playersGrid = document.getElementById('playersGrid');
        playersGrid.innerHTML = '';
        state.players.forEach(p => {
            const div = document.createElement('div');
            div.className = `player-badge ${p.folded ? 'folded' : ''}`;
            div.innerText = `${p.name} ${p.folded ? '(Fold)' : ''}`;
            playersGrid.appendChild(div);
        });
    });

    socket.on('showdown_results', (data) => {
        const banner = document.getElementById('winnerBanner');
        const winnerNames = data.winners.map(w => w.player.name).join(' & ');
        banner.innerText = `🎉 Vinner: ${winnerNames} (${data.pot} pt)`;
        banner.style.display = 'block';

        setTimeout(() => {
            banner.style.display = 'none';
        }, 8000);

        // Oppdater topp 10 automatisk etter showdown
        socket.emit('get_top10', { period: 'tonight' });
    });

    socket.on('top10_data', (data) => {
        const tbody = document.querySelector('#top10Table tbody');
        tbody.innerHTML = '';
        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><strong>${row.player}</strong></td><td>${row.total_points}</td><td>${row.wins}</td>`;
            tbody.appendChild(tr);
        });
    });

    // Hent Topp 10 ved oppstart
    socket.emit('get_top10', { period: 'tonight' });
</script>
</body>
</html>
