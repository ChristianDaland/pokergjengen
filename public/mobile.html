<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Mobil</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body style="padding: 20px; background-color: #0f172a; color: #f8fafc; font-family: sans-serif;">

  <div style="max-width: 400px; margin: 40px auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    <h2 style="color: #ffd700; text-align: center; margin-bottom: 20px;">♠️ Bli med på spillet ♥️</h2>
    
    <div id="login-section">
      <label style="display: block; margin-bottom: 8px; color: #94a3b8;">Velg hvem du er:</label>
      <select id="player-select" style="width: 100%; padding: 12px; border-radius: 6px; background: #0f172a; color: #fff; border: 1px solid #334155; margin-bottom: 20px; font-size: 1rem;">
        <option value="" disabled selected>-- Velg ditt navn --</option>
        <option value="Kai">Kai</option>
        <option value="Ronny">Ronny</option>
        <option value="Einar">Einar</option>
        <option value="Joakim">Joakim</option>
        <option value="Odd Christian">Odd Christian</option>
      </select>

      <button onclick="joinGame()" style="width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer;">
        Koble til spillet ➔
      </button>
    </div>

    <div id="status-section" style="display: none; text-align: center;">
      <p style="color: #94a3b8; margin-bottom: 5px;">Du er nå pålogget som:</p>
      <h3 id="player-display" style="color: #22c55e; font-size: 1.6rem; margin: 0 0 15px 0;"></h3>
      <div style="padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; color: #cbd5e1; font-size: 0.9rem;">
        Følg med på hovedskjermen på bordet! Dealer styrer spillet derfra.
      </div>
    </div>
  </div>

  <script>
    const socket = io();

    function joinGame() {
      const select = document.getElementById('player-select');
      const name = select.value;

      if (!name) {
        alert("Vennligst velg navnet ditt!");
        return;
      }

      // Kaller den eksisterende join_game funksjonen i server.js
      socket.emit('join_game', name);

      document.getElementById('login-section').style.display = 'none';
      document.getElementById('status-section').style.display = 'block';
      document.getElementById('player-display').innerText = name;
    }
  </script>

</body>
</html>
