<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spillerskjerm - Løland Gård Poker</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h2 { margin-top: 5px; font-size: 1.4rem; }

    .card-selection {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: white;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-join { background-color: #2196f3; color: white; }
    .btn-fold { background-color: #f44336; color: white; margin-top: 15px; }

    .cards-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }

    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-radius: 8px;
      width: 75px;
      height: 110px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      font-weight: bold;
      position: relative;
      padding: 5px;
      user-select: none;
    }

    .card.red { color: #d9534f; }
    .card.black { color: #222222; }

    .card-corner {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }
    .card-corner.top-left { align-self: flex-start; }
    .card-corner.bottom-right { align-self: flex-end; transform: rotate(180deg); }

    .card-corner .val { font-size: 1rem; font-weight: bold; }
    .card-corner .suit { font-size: 0.9rem; }

    .card-center-symbol {
      font-size: 2rem;
      line-height: 1;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .role-dealer { background-color: #ff9800; color: white; }
    .role-blind { background-color: #9c27b0; color: white; }

    .folded-overlay {
      color: #f44336;
      font-weight: bold;
      font-size: 1.2rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div id="login-screen" class="card-selection">
    <h2>Velkommen til Pokerbordet</h2>
    <p style="font-size: 0.9rem; color: #aaa;">Velg ditt navn eller skriv inn nytt:</p>
    
    <select id="player-select" onchange="toggleCustomNameInput()">
      <option value="">-- Velg spiller --</option>
      <option value="CUSTOM">+ Skriv annet navn...</option>
    </select>

    <input type="text" id="custom-name" placeholder="Skriv navnet ditt her..." style="display: none;">

    <button class="btn btn-join" onclick="joinGame()">Koble til</button>
  </div>

  <div id="game-screen" style="display: none; flex: 1;">
    <h3 id="player-title" style="margin-bottom: 5px;"></h3>
    <div id="player-role"></div>
    <div id="player-points" style="font-size: 0.9rem; color: #ffd700; margin-bottom: 10px;"></div>

    <div id="my-cards" class="cards-container"></div>

    <div id="fold-container">
      <button class="btn btn-fold" onclick="fold()">Kast kortene (Fold)</button>
    </div>

    <div id="folded-msg" class="folded-overlay" style="display: none;">
      Du har kastet deg denne runden.
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('preset_players', (presets) => {
      const select = document.getElementById('player-select');
      
      // Tøm eksisterende valg unntatt standard og spesiell innskriving
      select.innerHTML = '<option value="">-- Velg spiller --</option>';

      presets.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        select.appendChild(opt);
      });

      const customOpt = document.createElement('option');
      customOpt.value = 'CUSTOM';
      customOpt.innerText = '+ Skriv annet navn...';
      select.appendChild(customOpt);
    });

    function toggleCustomNameInput() {
      const select = document.getElementById('player-select');
      const customInput = document.getElementById('custom-name');
      
      if (select.value === 'CUSTOM') {
        customInput.style.display = 'block';
        customInput.focus();
      } else {
        customInput.style.display = 'none';
      }
    }

    function joinGame() {
      const select = document.getElementById('player-select');
      const customInput = document.getElementById('custom-name');
      let playerName = '';

      if (select.value === 'CUSTOM') {
        playerName = customInput.value.trim();
      } else {
        playerName = select.value;
      }

      if (!playerName) {
        alert('Vennligst velg eller skriv inn et navn');
        return;
      }

      socket.emit('join_game', playerName);

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('player-title').innerText = playerName;
    }

    function fold() {
      socket.emit('player_fold');
    }

    function formatCard(cardCode) {
      if (!cardCode) return '';
      let rawVal = cardCode.slice(0, -1).toUpperCase();
      let displayVal = rawVal === 'T' ? '10' : rawVal;
      const suitChar = cardCode.slice(-1).toLowerCase();
      
      const suits = {
        'h': { symbol: '♥', color: 'red' },
        'd': { symbol: '♦', color: 'red' },
        'c': { symbol: '♣', color: 'black' },
        's': { symbol: '♠', color: 'black' }
      };
      
      const suit = suits[suitChar] || { symbol: suitChar, color: 'black' };

      return `
        <div class="card ${suit.color}">
          <div class="card-corner top-left">
            <span class="val">${displayVal}</span>
            <span class="suit">${suit.symbol}</span>
          </div>
          <div class="card-center-symbol">${suit.symbol}</div>
          <div class="card-corner bottom-right">
            <span class="val">${displayVal}</span>
            <span class="suit">${suit.symbol}</span>
          </div>
        </div>
      `;
    }

    socket.on('player_state', (data) => {
      const roleDiv = document.getElementById('player-role');
      if (data.role) {
        let badgeClass = data.role === 'Dealer' ? 'role-dealer' : 'role-blind';
        roleDiv.innerHTML = `<span class="status-badge ${badgeClass}">${data.role}</span>`;
      } else {
        roleDiv.innerHTML = '';
      }

      const pointsDiv = document.getElementById('player-points');
      pointsDiv.innerText = `Poeng: ${data.points || 0}`;

      const cardsDiv = document.getElementById('my-cards');
      cardsDiv.innerHTML = (data.cards || []).map(c => formatCard(c)).join('');

      const foldBtn = document.getElementById('fold-container');
      const foldedMsg = document.getElementById('folded-msg');

      if (data.folded) {
        foldBtn.style.display = 'none';
        foldedMsg.style.display = 'block';
      } else {
        foldBtn.style.display = data.phase !== 'VENTING' && data.phase !== 'SHOWDOWN' ? 'block' : 'none';
        foldedMsg.style.display = 'none';
      }
    });
  </script>
</body>
</html>
