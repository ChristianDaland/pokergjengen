<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hybrid Poker - Mobil Spiller</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .card-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .card { width: 70px; height: 100px; border: 2px solid #fff; border-radius: 6px; background: #fff; color: #000; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; }
        .card.hidden { background: #444; color: #444; border-color: #666; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-fold { background-color: #dc3545; color: white; }
        .btn-join { background-color: #0d6efd; color: white; }
        .btn-toggle { background-color: #6c757d; color: white; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 10px; box-sizing: border-box; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; }
    </style>
</head>
<body>

    <h2>Mobil Pokerklient</h2>

    <div id="joinSection">
        <input type="text" id="playerName" placeholder="Skriv inn ditt navn">
        <button class="btn btn-join" onclick="joinGame()">Bli med i spillet</button>
    </div>

    <div id="gameSection" style="display: none;">
        <h3 id="welcomeMsg"></h3>
        
        <div>
            <p>Dine kort:</p>
            <div class="card-container" id="cardsDisplay"></div>
            <button class="btn btn-toggle" onclick="toggleCardVisibility()">Vis / Skjul kort</button>
        </div>

        <div style="margin-top: 30px;">
            <button class="btn btn-fold" onclick="confirmFold()">Kast kortene (Fold)</button>
        </div>
    </div>

<script>
    const socket = io();
    let showCards = false;
    let myCards = [];

    function joinGame() {
        const name = document.getElementById('playerName').value;
        if (name.trim() !== '') {
            socket.emit('join_game', { name: name.trim() });
            document.getElementById('joinSection').style.display = 'none';
            document.getElementById('gameSection').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = `Spiller som: ${name}`;
        }
    }

    function toggleCardVisibility() {
        showCards = !showCards;
        renderCards();
    }

    function renderCards() {
        const container = document.getElementById('cardsDisplay');
        container.innerHTML = '';

        if (myCards.length === 0) {
            container.innerHTML = '<p style="color:#888;">Ingen kort utdelt enda.</p>';
            return;
        }

        myCards.forEach(c => {
            const cardDiv = document.createElement('div');
            cardDiv.className = `card ${showCards ? '' : 'hidden'}`;
            cardDiv.innerText = showCards ? `${c.value}${c.suit}` : '?';
            container.appendChild(cardDiv);
        });
    }

    function confirmFold() {
        if (confirm("Er du sikker på at du vil kaste kortene dine?")) {
            socket.emit('player_fold');
            alert("Du har kastet kortene.");
        }
    }

    socket.on('state_update', (state) => {
        const me = state.players.find(p => p.id === socket.id);
        if (me) {
            myCards = me.cards || [];
            renderCards();
        }
    });
</script>
</body>
</html>
