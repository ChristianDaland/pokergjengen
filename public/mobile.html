<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker – Mobil</title>
  <style>
    body { font-family: Arial, sans-serif; background: #081c15; color: white; padding: 20px; text-align: center; }
    .btn-player { background: #52b788; color: #081c15; font-size: 1.5rem; font-weight: bold; border: none; padding: 15px; width: 100%; margin-bottom: 15px; border-radius: 10px; cursor: pointer; }
    .cards-row { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    .card { background: white; color: black; border-radius: 8px; width: 70px; height: 105px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Løland Gård Poker</h1>

  <div id="login-view">
    <h3>Velg din profil:</h3>
    <div id="players-buttons"></div>
  </div>

  <div id="game-view" style="display: none;">
    <h2 id="welcome-msg"></h2>
    <h3>Dine kort:</h3>
    <div id="my-cards" class="cards-row"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myName = localStorage.getItem('poker_user');

    socket.on('session_update', (session) => {
      if (!myName) {
        // Viser KUN de som er huket av som til stede
        const btnDiv = document.getElementById('players-buttons');
        btnDiv.innerHTML = session.presentPlayers.map(p => `
          <button class="btn-player" onclick="selectPlayer('${p}')">${p}</button>
        `).join('');
      } else {
        showGameView();
      }
    });

    function selectPlayer(name) {
      myName = name;
      localStorage.setItem('poker_user', name);
      showGameView();
    }

    function showGameView() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'block';
      document.getElementById('welcome-msg').innerText = `Spiller: ${myName}`;
    }

    socket.on('game_state', (state) => {
      if (!myName) return;
      const me = state.players.find(p => p.name === myName);
      if (me && me.cards) {
        document.getElementById('my-cards').innerHTML = me.cards.map(c => `
          <div class="card">${c}</div>
        `).join('');
      }
    });
  </script>
</body>
</html>
