<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Mobil</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body style="padding: 15px;">

  <div class="setup-card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="color: #ffd700; text-align: center; margin-bottom: 15px;">♠️ Mobil Spillerklient ♥️</h2>
    
    <!-- INNLOGGING / VELG SPILLER -->
    <div id="login-section">
      <div class="form-group">
        <label for="player-select">Velg hvem du er:</label>
        <select id="player-select">
          <option value="" disabled selected>-- Velg ditt navn --</option>
          <option value="Kai">Kai</option>
          <option value="Ronny">Ronny</option>
          <option value="Einar">Einar</option>
          <option value="Joakim">Joakim</option>
          <option value="Odd Christian">Odd Christian</option>
        </select>
      </div>

      <button id="join-btn" class="btn btn-primary" onclick="joinGame()" style="margin-top: 10px;">
        Koble til spillet ➔
      </button>
    </div>

    <!-- DASHBOARD FOR AKTIV SPILLER (Skjult før innlogging) -->
    <div id="active-section" class="hidden">
      <div style="background-color: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; text-align: center;">
        <span style="color: #94a3b8; font-size: 0.9rem;">Logget inn som:</span>
        <h3 id="current-player-display" style="color: #22c55e; font-size: 1.4rem; margin-top: 4px;"></h3>
      </div>

      <!-- Send inn egne kort -->
      <div class="form-group">
        <label for="mobile-card-input">Send inn dine kort / hånd:</label>
        <input type="text" id="mobile-card-input" placeholder="f.eks. Ah Kd 10s 7c" style="text-align: center; font-size: 1.1rem; text-transform: uppercase;">
        <span style="font-size: 0.8rem; color: #94a3b8; text-align: center; display: block; margin-top: 4px;">
          Bruk format som: Ah Kd Qs (A=Ess, K=Konge, Q=Dame, J=Knekt, s/h/d/c=spard/hjerter/ruter/kløver)
        </span>
      </div>

      <button class="btn btn-primary" onclick="sendCards()" style="margin-top: 10px;">
        Send kort til hovedskjerm 📤
      </button>

      <div id="status-message" style="margin-top: 15px; text-align: center; font-weight: bold; color: #22c55e;"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let selectedPlayerName = "";

    function joinGame() {
      const selectElem = document.getElementById('player-select');
      const name = selectElem.value;

      if (!name) {
        alert("Vennligst velg navnet ditt fra listen!");
        return;
      }

      selectedPlayerName = name;

      // Send join-event til serveren som matcher app.js (playerJoined)
      socket.emit('playerJoined', { playerName: name });

      // Oppdater brukergrensesnitt
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('active-section').classList.remove('hidden');
      document.getElementById('current-player-display').innerText = name;
    }

    function sendCards() {
      const cardInput = document.getElementById('mobile-card-input').value.trim();

      if (!cardInput) {
        alert("Vennligst skriv inn kortene dine først.");
        return;
      }

      // Send skannede/skrevne kort til serveren
      socket.emit('cardsScanned', {
        playerName: selectedPlayerName,
        cards: cardInput
      });

      const statusMsg = document.getElementById('status-message');
      statusMsg.innerText = "✓ Kortene ble sendt til bordet!";
      setTimeout(() => { statusMsg.innerText = ""; }, 3000);
    }
  </script>

</body>
</html>
