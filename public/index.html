<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Bordvisning</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; margin: 0;">

  <div style="max-width: 1100px; margin: 0 auto;">
    
    <!-- HEADER -->
    <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px;">
      <h1 style="color: #ffd700; margin: 0;">♠️ Løland Gård Poker ♥️</h1>
      <div id="game-status-badge" style="background: #1e293b; padding: 8px 16px; border-radius: 20px; font-weight: bold; border: 1px solid #334155;">
        Fase: <span id="current-phase" style="color: #38bdf8;">VENTING</span>
      </div>
    </header>

    <!-- DEALER OG SPILLKONTROLLER -->
    <div style="background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155;">
      <h3 style="margin-top: 0; color: #94a3b8;">Dealer Kontrollpanel</h3>
      <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
        
        <!-- Velg modus -->
        <div>
          <label style="font-size: 0.9rem; color: #cbd5e1; display: block; margin-bottom: 4px;">Spillemodus:</label>
          <button onclick="setGameMode('TEXAS')" class="btn" style="padding: 8px 16px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Texas Hold'em</button>
          <button onclick="setGameMode('OMAHA')" class="btn" style="padding: 8px 16px; background: #0d9488; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Omaha</button>
        </div>

        <div style="height: 30px; border-left: 1px solid #475569; margin: 0 10px;"></div>

        <!-- Spillknapper -->
        <button onclick="startNewHand()" style="padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem;">
          🎴 Start Ny Hånd
        </button>

        <button onclick="nextPhase()" style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem;">
          ➡️ Neste Fase (Åpne Bord)
        </button>

      </div>
    </div>

    <!-- FELLESKORT (BOARD) -->
    <div style="background: #022c22; padding: 25px; border-radius: 16px; border: 2px solid #15803d; text-align: center; margin-bottom: 25px;">
      <h2 style="margin-top: 0; color: #86efac; font-size: 1.2rem; letter-spacing: 1px;">FELLESKORT ON THE BOARD</h2>
      <div id="board-cards" style="display: flex; justify-content: center; gap: 12px; min-height: 90px; align-items: center; margin-top: 15px;">
        <span style="color: #4ade80; font-style: italic;">Ingen kort på bordet enda...</span>
      </div>
    </div>

    <!-- VINNERMELDING DISPLAY -->
    <div id="winner-box" style="display: none; background: #854d0e; border: 2px solid #facc15; color: #fef08a; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 25px; font-size: 1.3rem; font-weight: bold;">
    </div>

    <!-- SPILLERE RUNDT BORDET -->
    <h3 style="color: #cbd5e1; margin-bottom: 12px;">Tilkoblede Spillere:</h3>
    <div id="players-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">
      <!-- Genereres dynamisk av app.js -->
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
