<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker</title>
  <link rel="stylesheet" href="style.css">
  <!-- Importer Socket.IO klientbibliotek -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Header med Hamburgermeny -->
  <header>
    <div class="header-content">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Meny">
        ☰
      </button>
      <h1>Løland Gård Poker</h1>
    </div>

    <!-- Dropdown meny -->
    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="#" id="menuNewGame">Start Ny Spillekveld</a></li>
        <li><a href="board.html" target="_blank">Åpne Bordvisning</a></li>
        <li><a href="mobile.html" target="_blank">Åpne Mobilvisning</a></li>
      </ul>
    </nav>
    
    <!-- Top Controls -->
    <div class="top-controls">
      <div class="control-group">
        <label for="hostSelect">🏡 Vert:</label>
        <select id="hostSelect">
          <option value="Odd Christian" selected>Odd Christian</option>
          <option value="Einar">Einar</option>
          <option value="Kai">Kai</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Winner Banner -->
  <div class="status-banner" id="winnerText">
    Venter på spillere...
  </div>

  <!-- Main Content Layout -->
  <div class="table-container">
    
    <!-- Poker Table Felt -->
    <div class="poker-table">
      
      <div class="table-header-info" id="gameModeText">
        Modus: OMAHA | Fase: VENTING
      </div>

      <!-- Felleskort på bordet -->
      <div class="community-cards" id="communityCardsContainer"></div>

      <!-- Spillere på bordet -->
      <div class="players-grid" id="playersGridContainer"></div>

    </div>

    <!-- Sidebar Right -->
    <div class="sidebar">
      <div class="qr-box">
        <p><strong>Skann for å bli med:</strong></p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://pokergjengen.onrender.com/mobile.html" alt="QR Code til mobilvisning">
      </div>

      <a href="board.html" target="_blank" class="btn btn-orange" style="text-decoration: none;">💻 Åpne Bordvisning</a>
      <button class="btn btn-blue" id="btnNextRound">Ny Runde</button>
    </div>

  </div>

  <!-- Bottom Control Bar -->
  <div class="bottom-bar">
    <button class="btn-small" id="btnGameType">Spilltype</button>
    <button class="btn-small" id="btnStartHand">Start Ny Hånd</button>
    <button class="btn-small" id="btnGuide">📖 Spilleveiledning</button>
  </div>

  <!-- ==========================================
       JAVASCRIPT CARD RENDER MODULE & SOCKET SYNC
       ========================================== -->
  <script>
    // 1. Hamburgermeny toggle
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');

    if (hamburgerBtn && navMenu) {
      hamburgerBtn.addEventListener('click', () => {
        navMenu.classList.toggle('open');
      });
    }

    // 2. Kortrendering (Rent hjørnedesign for index.html)
    function getSuitSymbol(suit) {
      const s = String(suit || '').toLowerCase();
      if (s.includes('heart') || s === 'h' || s === '♥') return '♥';
      if (s.includes('diamond') || s === 'd' || s === '♦') return '♦';
      if (s.includes('spade') || s === 's' || s === '♠') return '♠';
      if (s.includes('club') || s === 'c' || s === '♣') return '♣';
      return suit || '';
    }

    function getSuitClass(suit) {
      const s = String(suit || '').toLowerCase();
      if (s.includes('heart') || s === 'h' || s === '♥') return 'hearts';
      if (s.includes('diamond') || s === 'd' || s === '♦') return 'diamonds';
      if (s.includes('spade') || s === 's' || s === '♠') return 'spades';
      return 'clubs';
    }

    function createCardHTML(card) {
      if (!card) return `<div class="card card-back"></div>`;

      const suitClass = getSuitClass(card.suit);
      const symbol = getSuitSymbol(card.suit);
      const val = card.value || card.rank || '';

      return `
        <div class="card ${suitClass}">
          <div class="card-corner top-left">
            <span class="card-value">${val}</span>
            <span class="card-suit">${symbol}</span>
          </div>
          <div class="card-corner bottom-right">
            <span class="card-value">${val}</span>
            <span class="card-suit">${symbol}</span>
          </div>
        </div>
      `;
    }

    // 3. Render-funksjon som oppdaterer hele bordet
    function renderGameData(state) {
      if (!state) return;

      // Oppdater status/vinner
      const winnerBanner = document.getElementById('winnerText');
      if (winnerBanner) {
        winnerBanner.textContent = state.winnerText || (state.players && state.players.length > 0 ? 'Spillere tilkoblet' : 'Venter på spillere...');
      }

      // Oppdater Modus & Fase
      const modeText = document.getElementById('gameModeText');
      if (modeText) {
        modeText.textContent = `Modus: ${state.mode || 'OMAHA'} | Fase: ${state.phase || 'VENTING'}`;
      }

      // Render Felleskort
      const communityContainer = document.getElementById('communityCardsContainer');
      if (communityContainer) {
        const cards = Array.isArray(state.communityCards) ? state.communityCards : [];
        communityContainer.innerHTML = cards.map(card => createCardHTML(card)).join('');
      }

      // Render Spillere når de logger inn på mobilen
      const playersContainer = document.getElementById('playersGridContainer');
      if (playersContainer) {
        const players = Array.isArray(state.players) ? state.players : [];
        if (players.length === 0) {
          playersContainer.innerHTML = '<div style="color: #ccc; font-style: italic;">Ingen spillere har koblet seg til ennå</div>';
        } else {
          playersContainer.innerHTML = players.map(player => {
            const cardsHTML = (player.cards || []).map(card => createCardHTML(card)).join('');
            return `
              <div class="player-box">
                <div class="player-info">
                  <div class="player-name">${player.name || 'Ukjent'}</div>
                  <div class="player-meta">Plass ${player.place || '-'} | Poeng: ${player.points || 0}</div>
                  ${player.role ? `<span class="player-badge">${player.role}</span>` : ''}
                  <div class="player-meta" style="color: #4caf50; font-weight: bold; margin-top: 4px;">
                    🟢 ${player.status || 'TILKOBLET'}
                  </div>
                </div>
                <div class="player-cards-container">
                  ${cardsHTML}
                </div>
              </div>
            `;
          }).join('');
        }
      }
    }

    // 4. Koble til server via Socket.IO for live-oppdateringer fra mobil
    const socket = io();

    // Lütt etter spilltilstand fra serveren
    socket.on('gameState', (state) => {
      renderGameData(state);
    });

    socket.on('playersUpdated', (players) => {
      renderGameData({ players: players });
    });

    // Global eksponering
    window.updatePokerBoard = renderGameData;
  </script>
</body>
</html>
