<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Poker - Hovedpanel</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      color: #ffd700;
      margin-top: 0;
    }

    .launch-btn {
      display: inline-block;
      width: 100%;
      background: #059669;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-sizing: border-box;
      transition: background 0.2s;
    }

    .launch-btn:hover {
      background: #10b981;
    }

    .info-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>♠️ Løland Poker Control ♥️</h1>
    <p>Velkommen til kontrollpanelet på PC.</p>

    <!-- Hovedknapp for å starte TV/Bordskjermen -->
    <a href="/board" target="_blank" class="launch-btn">
      🖥️ Åpne Bordskjerm (TV / Projektor)
    </a>

    <div class="info-box">
      <h3 style="margin-top:0; color:#f8fafc;">📱 Spillere på mobil:</h3>
      <p>Spillerne skanner QR-koden på bordskjermen for å komme direkte til sin mobilvisning.</p>
    </div>
  </div>

</body>
</html>
