<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Løland Gård Poker</h1>
    
    <!-- Top Controls -->
    <div class="top-controls">
      <div class="control-group">
        <label for="hostSelect">🏡 Vert:</label>
        <select id="hostSelect">
          <option value="Odd Christian" selected>Odd Christian</option>
          <option value="Einar">Einar</option>
          <option value="Kai">Kai</option>
        </select>
      </div>

      <div class="control-group">
        <label for="locationInput">📍 Sted:</label>
        <input type="text" id="locationInput" placeholder="F.eks. Hos Kai / Gården">
      </div>
    </div>
  </header>

  <!-- Winner Banner -->
  <div class="status-banner" id="winnerText">
    🏆 VINNER: Odd Christian (To Par, J's & 2's)
  </div>

  <!-- Main Content Layout -->
  <div class="table-container">
    
    <!-- Poker Table Felt -->
    <div class="poker-table">
      
      <div class="table-header-info" id="gameModeText">
        Modus: OMAHA | Fase: SHOWDOWN
      </div>

      <!-- Felleskort på bordet (Large view with center symbol) -->
      <div class="community-cards" id="communityCardsContainer">
        <!-- Genereres dynamisk fra JS -->
      </div>

      <!-- Spillere på bordet (Compact view with corners only) -->
      <div class="players-grid" id="playersGridContainer">
        <!-- Genereres dynamisk fra JS -->
      </div>

    </div>

    <!-- Sidebar Right -->
    <div class="sidebar">
      <div class="qr-box">
        <p><strong>Skann for å bli med:</strong></p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://pokergjengen.onrender.com" alt="QR Code">
      </div>

      <button class="btn btn-orange">💻 Åpne Bordvisning</button>
      <button class="btn btn-blue">Ny Runde</button>
    </div>

  </div>

  <!-- Bottom Control Bar -->
  <div class="bottom-bar">
    <button class="btn-small">Spilltype</button>
    <button class="btn-small">Start Ny Hånd</button>
    <button class="btn-small">📖 Spilleveiledning</button>
  </div>


  <!-- ==========================================
       JAVASCRIPT CARD RENDER MODULE & GAME LOGIC
       ========================================== -->
  <script>
    // -------------------------------------------------------------
    // HJELPEFUNKSJONER FOR KORT
    // -------------------------------------------------------------
    function getSuitSymbol(suit) {
      const s = String(suit).toLowerCase();
      if (s.includes('heart') || s === 'h' || s === '♥') return '♥';
      if (s.includes('diamond') || s === 'd' || s === '♦') return '♦';
      if (s.includes('spade') || s === 's' || s === '♠') return '♠';
      if (s.includes('club') || s === 'c' || s === '♣') return '♣';
      return suit;
    }

    function getSuitClass(suit) {
      const s = String(suit).toLowerCase();
      if (s.includes('heart') || s === 'h' || s === '♥') return 'hearts';
      if (s.includes('diamond') || s === 'd' || s === '♦') return 'diamonds';
      if (s.includes('spade') || s === 's' || s === '♠') return 'spades';
      return 'clubs';
    }

    // -------------------------------------------------------------
    // SPILLERKORT: Kun hjørner (verdi + symbol)
    // -------------------------------------------------------------
    function createPlayerCardHTML(card) {
      if (!card) return `<div class="player-card card-back"></div>`;

      const suitClass = getSuitClass(card.suit);
      const symbol = getSuitSymbol(card.suit);
      const val = card.value || card.rank;

      return `
        <div class="player-card ${suitClass}">
          <div class="card-corner top-left">
            <span class="card-value">${val}</span>
            <span class="card-suit">${symbol}</span>
          </div>
          <div class="card-corner bottom-right">
            <span class="card-value">${val}</span>
            <span class="card-suit">${symbol}</span>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // FELLESKORT (BORDET): Bevares uendret med midtsymbol
    // -------------------------------------------------------------
    function createCommunityCardHTML(card) {
      if (!card) return `<div class="card card-back"></div>`;

      const suitClass = getSuitClass(card.suit);
      const symbol = getSuitSymbol(card.suit);
      const val = card.value || card.rank;

      return `
        <div class="card ${suitClass}">
          <div class="top-left">${val}${symbol}</div>
          <div class="card-center-symbol">${symbol}</div>
          <div class="bottom-right">${val}${symbol}</div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // RENDERING AV SPELL-DATA (DEMO / TEST)
    // -------------------------------------------------------------
    const gameState = {
      communityCards: [
        { value: '2', suit: 'spades' },
        { value: '3', suit: 'hearts' },
        { value: 'J', suit: 'diamonds' },
        { value: '5', suit: 'hearts' },
        { value: '2', suit: 'hearts' }
      ],
      players: [
        {
          name: 'Odd Christian',
          place: 1,
          points: 4,
          role: 'Lilleblind',
          status: 'INNE',
          cards: [
            { value: '6', suit: 'spades' },
            { value: 'J', suit: 'clubs' },
            { value: '7', suit: 'hearts' },
            { value: 'A', suit: 'spades' }
          ]
        },
        {
          name: 'Einar',
          place: 2,
          points: 0,
          role: 'Storeblind',
          status: 'INNE',
          cards: [
            { value: 'K', suit: 'diamonds' },
            { value: '10', suit: 'spades' },
            { value: '3', suit: 'clubs' },
            { value: '5', suit: 'clubs' }
          ]
        }
      ]
    };

    function renderBoard() {
      // 1. Render Felleskort
      const communityContainer = document.getElementById('communityCardsContainer');
      communityContainer.innerHTML = gameState.communityCards
        .map(card => createCommunityCardHTML(card))
        .join('');

      // 2. Render Spillere og deres håndkort
      const playersContainer = document.getElementById('playersGridContainer');
      playersContainer.innerHTML = gameState.players.map(player => {
        const playerBadgeClass = player.role === 'Lilleblind' ? 'badge-sb' : 'badge-bb';
        const cardsHTML = player.cards.map(card => createPlayerCardHTML(card)).join('');

        return `
          <div class="player-box">
            <div class="player-info">
              <div class="player-name">${player.name}</div>
              <div class="player-meta">Plass ${player.place} | Poeng: ${player.points}</div>
              <span class="player-badge ${playerBadgeClass}">${player.role}</span>
              <div class="player-meta" style="color: #4caf50; font-weight: bold; margin-top: 4px;">
                🟢 ${player.status}
              </div>
            </div>
            <div class="player-cards-container">
              ${cardsHTML}
            </div>
          </div>
        `;
      }).join('');
    }

    // Kjør rendering når siden laster
    document.addEventListener('DOMContentLoaded', renderBoard);
  </script>
</body>
</html>
