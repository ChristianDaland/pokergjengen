<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-content">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Meny">
        ☰
      </button>
      <h1>Løland Gård Poker</h1>
    </div>

    <!-- Dropdown meny (Fasebasert UI/UX - Skjult Hjørnemeny) -->
    <nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="#" id="menuTop10">📊 Topp 10-lister</a></li>
        <li><a href="#" id="menuNotes">📝 Kveldsnotater / Dagbok</a></li>
        <li><a href="#" id="menuExport">📥 Eksporter Rådata til Excel (CSV)</a></li>
        <li><a href="#" id="menuArchive">📜 Historisk Arkiv</a></li>
        <li><a href="#" id="menuAbout">ℹ️ Om spillet</a></li>
        <li><a href="#" id="menuGuide">📖 Brukerveiledning</a></li>
      </ul>
    </nav>
    
    <!-- Top Controls -->
    <div class="top-controls">
      <div class="control-group">
        <label for="hostSelect">🏡 Vert:</label>
        <select id="hostSelect">
          <option value="Odd Christian" selected>Odd Christian</option>
          <option value="Einar">Einar</option>
          <option value="Kai">Kai</option>
          <option value="Ronny">Ronny</option>
          <option value="Joakim">Joakim</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Winner Banner -->
  <div class="status-banner" id="winnerText">
    Venter på spillere...
  </div>

  <!-- Main Content Layout -->
  <div class="table-container">
    
    <!-- Poker Table Felt -->
    <div class="poker-table">
      
      <div class="table-header-info" id="gameModeText">
        Modus: OMAHA | Fase: VENTING
      </div>

      <!-- Felleskort -->
      <div class="community-cards" id="communityCardsContainer"></div>

      <!-- Spillere -->
      <div class="players-grid" id="playersGridContainer"></div>

    </div>

    <!-- Sidebar Right -->
    <div class="sidebar">
      <div class="qr-box">
        <p><strong>Skann for å bli med:</strong></p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://pokergjengen.onrender.com/mobile.html" alt="QR Code til mobilvisning">
      </div>

      <a href="board.html" target="_blank" class="btn btn-orange" style="text-decoration: none;">💻 Åpne Bordvisning</a>
      <button class="btn btn-blue" id="btnNextRound">Ny Runde / Neste Fase</button>
    </div>

  </div>

  <!-- Bottom Control Bar -->
  <div class="bottom-bar">
    <button class="btn-small" id="btnTexas">Texas Hold'em</button>
    <button class="btn-small" id="btnOmaha">Omaha</button>
    <button class="btn-small" id="btnStartHand">Start Ny Hånd</button>
  </div>

  <!-- ==========================================
       JAVASCRIPT CARD RENDER MODULE & SOCKET SYNC
       ========================================== -->
  <script>
    const socket = io();

    // 1. Hamburgermeny toggle
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const navMenu = document.getElementById('navMenu');

    if (hamburgerBtn && navMenu) {
      hamburgerBtn.addEventListener('click', () => {
        navMenu.classList.toggle('open');
      });
    }

    // 2. Oversettelse av kort fra backend (f.eks "Th" -> Value: "10", Suit: "h")
    function parseCardString(cardStr) {
      if (!cardStr || typeof cardStr !== 'string' || cardStr.length < 2) return null;
      let val = cardStr.charAt(0);
      let suit = cardStr.charAt(1);

      if (val === 'T') val = '10';

      return { val, suit };
    }

    function getSuitSymbol(suit) {
      const s = String(suit || '').toLowerCase();
      if (s === 'h' || s === '♥') return '♥';
      if (s === 'd' || s === '♦') return '♦';
      if (s === 's' || s === '♠') return '♠';
      if (s === 'c' || s === '♣') return '♣';
      return suit || '';
    }

    function getSuitClass(suit) {
      const s = String(suit || '').toLowerCase();
      if (s === 'h' || s === '♥') return 'hearts';
      if (s === 'd' || s === '♦') return 'diamonds';
      if (s === 's' || s === '♠') return 'spades';
      return 'clubs';
    }

    // Hjørnedesign for kortene
    function createCardHTML(cardStr) {
      const parsed = parseCardString(cardStr);
      if (!parsed) return `<div class="card card-back"></div>`;

      const suitClass = getSuitClass(parsed.suit);
      const symbol = getSuitSymbol(parsed.suit);
      const val = parsed.val;

      return `
        <div class="card ${suitClass}">
          <div class="card-corner top-left">
            <span class="card-value">${val}</span>
            <span class="card-suit">${symbol}</span>
          </div>
          <div class="card-corner bottom-right">
            <span class="card-value">${val}</span>
            <span class="card-suit">${symbol}</span>
          </div>
        </div>
      `;
    }

    // 3. Render hele bordet når 'state_update' mottas fra serveren
    socket.on('state_update', (data) => {
      if (!data) return;

      // Top banner (Vinner / status)
      const winnerBanner = document.getElementById('winnerText');
      if (winnerBanner) {
        if (data.winnerInfo) {
          winnerBanner.textContent = `🏆 VINNER: ${data.winnerInfo.winnerName} (${data.winnerInfo.descr})`;
        } else if (data.players && data.players.length > 0) {
          winnerBanner.textContent = `Tilkoblede spillere: ${data.players.length}`;
        } else {
          winnerBanner.textContent = 'Venter på spillere...';
        }
      }

      // Modus og Fase
      const modeText = document.getElementById('gameModeText');
      if (modeText) {
        const mode = data.gameMode || 'IKKE VALGT';
        const phase = data.phase || 'VENTING';
        modeText.textContent = `Modus: ${mode} | Fase: ${phase}`;
      }

      // Felleskort (board)
      const communityContainer = document.getElementById('communityCardsContainer');
      if (communityContainer) {
        const boardCards = Array.isArray(data.board) ? data.board : [];
        communityContainer.innerHTML = boardCards.map(card => createCardHTML(card)).join('');
      }

      // Spillere (players)
      const playersContainer = document.getElementById('playersGridContainer');
      if (playersContainer) {
        const players = Array.isArray(data.players) ? data.players : [];
        
        if (players.length === 0) {
          playersContainer.innerHTML = '<div style="color: #ccc; font-style: italic;">Ingen spillere tilkoblet</div>';
        } else {
          playersContainer.innerHTML = players.map(player => {
            const statusText = player.connected ? (player.folded ? '🔴 KASTET' : '🟢 INNE') : '⚪ FRAKOBLET';
            const cardsHTML = (player.cards || []).map(card => createCardHTML(card)).join('');

            return `
              <div class="player-box ${player.folded ? 'player-folded' : ''}">
                <div class="player-info">
                  <div class="player-name">${player.name || 'Ukjent'}</div>
                  <div class="player-meta">Plass ${player.seat || '-'} | Poeng: ${player.points || 0}</div>
                  ${player.role ? `<span class="player-badge">${player.role}</span>` : ''}
                  <div class="player-meta" style="font-weight: bold; margin-top: 4px;">
                    ${statusText}
                  </div>
                </div>
                <div class="player-cards-container">
                  ${cardsHTML}
                </div>
              </div>
            `;
          }).join('');
        }
      }
    });

    // 4. Knappehandlinger knyttet til backend-socket-events
    document.getElementById('hostSelect')?.addEventListener('change', (e) => {
      socket.emit('set_gamenight', { host: e.target.value });
    });

    document.getElementById('btnTexas')?.addEventListener('click', () => {
      socket.emit('set_game_mode', 'TEXAS');
    });

    document.getElementById('btnOmaha')?.addEventListener('click', () => {
      socket.emit('set_game_mode', 'OMAHA');
    });

    document.getElementById('btnStartHand')?.addEventListener('click', () => {
      socket.emit('start_new_hand');
    });

    document.getElementById('btnNextRound')?.addEventListener('click', () => {
      socket.emit('next_phase');
    });
  </script>
</body>
</html>
