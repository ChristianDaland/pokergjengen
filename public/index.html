<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background-color: #1a4d2e;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* TOP HEADER */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 15px;
    }

    .hamburger-icon {
      font-size: 24px;
      cursor: pointer;
    }

    .main-title {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      flex-grow: 1;
    }

    .host-badge {
      background: #4a5d4e;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .host-badge select {
      background: #111;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* CONNECTED PLAYERS BANNER */
    .connected-banner {
      background: #ff7b54;
      color: white;
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      font-size: 18px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* MAIN POKER BOARD CONTAINER */
    .game-container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      align-items: flex-start;
      justify-content: center;
    }

    .poker-felt {
      background: #1e5631;
      border: 6px solid #8b4513;
      border-radius: 40px;
      width: 650px;
      min-height: 320px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .status-text {
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .players-list {
      display: flex;
      gap: 20px;
      justify-content: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .player-card {
      background: #111;
      border-radius: 12px;
      padding: 15px;
      width: 160px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .player-card .name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .player-card .info {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 8px;
    }

    .player-card .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #2ecc71;
      border-radius: 50%;
      margin-right: 4px;
    }

    .player-card .status-tag {
      font-size: 12px;
      color: #2ecc71;
      font-weight: bold;
    }

    /* WINNER BANNER AT SHOWDOWN */
    .winner-banner {
      background: #d35400;
      border: 2px solid #f39c12;
      border-radius: 12px;
      width: 100%;
      padding: 12px;
      text-align: center;
      display: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .winner-banner .winner-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .winner-banner .winner-hand {
      font-size: 14px;
      color: #f1c40f;
    }

    /* RIGHT SIDEBAR (QR & MAIN ACTIONS) */
    .sidebar-right {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 180px;
    }

    .qr-card {
      background: #0f2b1d;
      border: 1px solid #2e7d32;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .qr-card p {
      font-size: 12px;
      margin-bottom: 8px;
    }

    .qr-card img, .qr-card canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 6px;
    }

    .btn-orange {
      background: #ff9f1c;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .btn-blue {
      background: #2b7fff;
      color: white;
      border: none;
      padding: 18px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      line-height: 1.3;
    }

    /* BOTTOM LEFT BUTTONS */
    .bottom-left-controls {
      position: fixed;
      bottom: 15px;
      left: 15px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .btn-green-sm {
      background: #2e7d32;
      color: white;
      border: 1px solid #4caf50;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-green-sm:hover {
      background: #388e3c;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="hamburger-icon">☰</div>
    <div class="main-title">Løland Gård Poker</div>
    <div class="host-badge">
      <span>🍿 Vert:</span>
      <select id="hostSelect">
        <option value="Odd Christian">Odd Christian</option>
      </select>
    </div>
  </div>

  <!-- CONNECTED PLAYERS BANNER -->
  <div class="connected-banner" id="connectedBanner">
    Tilkoblede spillere: 0
  </div>

  <!-- MAIN GAME AREA -->
  <div class="game-container">
    <div class="poker-felt">
      <div class="status-text" id="statusText">MODUS: IKKE VALGT | FASE: VENTING</div>

      <div class="players-list" id="playersList">
        <!-- Spillere rendres her dynamisk -->
      </div>

      <!-- VINNER BANNER -->
      <div class="winner-banner" id="winnerBanner">
        <div class="winner-title" id="winnerTitle">Vinner: -</div>
        <div class="winner-hand" id="winnerHand">Hånd: -</div>
      </div>
    </div>

    <div class="sidebar-right">
      <div class="qr-card">
        <p>Skann for å bli med:</p>
        <div id="qrcode"></div>
      </div>

      <a href="/board.html" target="_blank" class="btn-orange">Åpne Bordvisning</a>
      <button class="btn-blue" id="btnNextPhase">Ny Runde / Neste Fase</button>
    </div>
  </div>

  <!-- KNAPPER NEDE TIL VENSTRE -->
  <div class="bottom-left-controls">
    <button class="btn-green-sm" id="btnTexas">Texas Hold'em</button>
    <button class="btn-green-sm" id="btnOmaha">OMAHA</button>
    <button class="btn-green-sm" id="btnStartHand">Start Ny Hånd</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const socket = io();

    // Generer QR-kode
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.origin + "/mobile.html",
      width: 140,
      height: 140
    });

    // Knappeevents
    document.getElementById('btnTexas').addEventListener('click', () => {
      socket.emit('set_game_mode', 'TEXAS');
    });

    document.getElementById('btnOmaha').addEventListener('click', () => {
      socket.emit('set_game_mode', 'OMAHA');
    });

    document.getElementById('btnStartHand').addEventListener('click', () => {
      socket.emit('start_new_hand');
    });

    document.getElementById('btnNextPhase').addEventListener('click', () => {
      socket.emit('next_phase');
    });

    // Oppdatering fra server
    socket.on('state_update', (state) => {
      const totalPlayers = state.players ? state.players.length : 0;
      document.getElementById('connectedBanner').innerText = `Tilkoblede spillere: ${totalPlayers}`;

      const mode = state.gameMode || 'IKKE VALGT';
      const phase = state.phase || 'VENTING';
      document.getElementById('statusText').innerText = `MODUS: ${mode} | FASE: ${phase}`;

      // Spillere
      const playersList = document.getElementById('playersList');
      playersList.innerHTML = '';

      if (state.players && state.players.length > 0) {
        state.players.forEach(p => {
          const card = document.createElement('div');
          card.className = 'player-card';
          card.innerHTML = `
            <div class="name">${p.name}</div>
            <div class="info">Plass ${p.seat || 1} | Poeng: ${p.points || 1000}</div>
            <div>
              <span class="status-dot"></span>
              <span class="status-tag">INNE</span>
            </div>
          `;
          playersList.appendChild(card);
        });
      }

      // Vinnerhåndtering i Showdown
      const winnerBanner = document.getElementById('winnerBanner');
      if (phase === 'SHOWDOWN' && state.winner) {
        winnerBanner.style.display = 'block';
        document.getElementById('winnerTitle').innerText = `Vinner: ${state.winner.name}`;
        document.getElementById('winnerHand').innerText = state.winner.handDescr || state.winner.hand || '';
      } else {
        winnerBanner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
