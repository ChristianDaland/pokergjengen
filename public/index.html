<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background-color: #1a4d2e;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* HAMBURGER SIDE-MENU */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 2000;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #111;
      padding: 20px;
      transition: left 0.3s ease;
      z-index: 2001;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .side-menu.active {
      left: 0;
    }

    .side-menu h2 {
      font-size: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .side-menu ul {
      list-style: none;
    }

    .side-menu li {
      padding: 12px 0;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }

    .side-menu li:hover {
      color: #2ecc71;
    }

    /* TOP HEADER */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 15px;
    }

    .hamburger-icon {
      font-size: 26px;
      cursor: pointer;
      user-select: none;
    }

    .main-title {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      flex-grow: 1;
    }

    .host-badge {
      background: #4a5d4e;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .host-badge select {
      background: #111;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* BANNER */
    .connected-banner {
      background: #ff7b54;
      color: white;
      width: 100%;
      max-width: 800px;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      font-size: 18px;
      border-radius: 20px;
      margin-bottom: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* MAIN POKER BOARD */
    .game-container {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      align-items: flex-start;
      justify-content: center;
    }

    .poker-felt {
      background: #1e5631;
      border: 6px solid #8b4513;
      border-radius: 40px;
      width: 650px;
      min-height: 340px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 8px 16px rgba(0,0,0,0.4);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .status-text {
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .players-list {
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .player-card {
      background: #111;
      border-radius: 12px;
      padding: 12px;
      width: 180px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .player-card.winner {
      border: 2px solid #f1c40f;
      box-shadow: 0 0 12px #f1c40f;
    }

    .player-card .name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .player-card .info {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 6px;
    }

    /* SHOWDOWN CARDS */
    .showdown-cards {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-top: 8px;
    }

    .mini-card {
      background: white;
      color: black;
      border-radius: 4px;
      padding: 4px 6px;
      font-weight: bold;
      font-size: 13px;
      border: 1px solid #888;
    }

    .mini-card.red { color: #d63031; }

    /* WINNER BANNER */
    .winner-banner {
      background: #d35400;
      border: 2px solid #f39c12;
      border-radius: 12px;
      width: 100%;
      padding: 12px;
      text-align: center;
      display: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .winner-banner .winner-title {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .winner-banner .winner-hand {
      font-size: 14px;
      color: #f1c40f;
    }

    /* RIGHT SIDEBAR */
    .sidebar-right {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 180px;
    }

    .qr-card {
      background: #0f2b1d;
      border: 1px solid #2e7d32;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .qr-card p {
      font-size: 12px;
      margin-bottom: 8px;
    }

    .qr-card img, .qr-card canvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 6px;
    }

    .btn-orange {
      background: #ff9f1c;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .btn-blue {
      background: #2b7fff;
      color: white;
      border: none;
      padding: 18px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      line-height: 1.3;
    }

    /* BOTTOM LEFT BUTTONS */
    .bottom-left-controls {
      position: fixed;
      bottom: 15px;
      left: 15px;
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    .btn-green-sm {
      background: #2e7d32;
      color: white;
      border: 1px solid #4caf50;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-green-sm:hover {
      background: #388e3c;
    }
  </style>
</head>
<body>

  <!-- SIDE MENU (HAMBURGER) -->
  <div class="menu-overlay" id="menuOverlay"></div>
  <div class="side-menu" id="sideMenu">
    <h2>Meny</h2>
    <ul>
      <li onclick="socket.emit('reset_game')">Nullstill Spill</li>
      <li onclick="window.open('/board.html', '_blank')">Åpne Bordvisning</li>
      <li onclick="toggleMenu()">Lukk Meny</li>
    </ul>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="hamburger-icon" id="hamburgerBtn">☰</div>
    <div class="main-title">Løland Gård Poker</div>
    <div class="host-badge">
      <span>🍿 Vert:</span>
      <select id="hostSelect">
        <option value="Odd Christian">Odd Christian</option>
      </select>
    </div>
  </div>

  <!-- CONNECTED PLAYERS BANNER -->
  <div class="connected-banner" id="connectedBanner">
    Tilkoblede spillere: 0
  </div>

  <!-- MAIN GAME AREA -->
  <div class="game-container">
    <div class="poker-felt">
      <div class="status-text" id="statusText">MODUS: IKKE VALGT | FASE: VENTING</div>

      <div class="players-list" id="playersList">
        <!-- Spillere rendres her dynamisk -->
      </div>

      <!-- VINNER BANNER -->
      <div class="winner-banner" id="winnerBanner">
        <div class="winner-title" id="winnerTitle">Vinner: -</div>
        <div class="winner-hand" id="winnerHand">Hånd: -</div>
      </div>
    </div>

    <div class="sidebar-right">
      <div class="qr-card">
        <p>Skann for å bli med:</p>
        <div id="qrcode"></div>
      </div>

      <a href="/board.html" target="_blank" class="btn-orange">Åpne Bordvisning</a>
      <button class="btn-blue" id="btnNextPhase">Ny Runde / Neste Fase</button>
    </div>
  </div>

  <!-- KNAPPER NEDE TIL VENSTRE -->
  <div class="bottom-left-controls">
    <button class="btn-green-sm" id="btnTexas">Texas Hold'em</button>
    <button class="btn-green-sm" id="btnOmaha">OMAHA</button>
    <button class="btn-green-sm" id="btnStartHand">Start Ny Hånd</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const socket = io();

    // Hamburgermeny logikk
    const sideMenu = document.getElementById('sideMenu');
    const menuOverlay = document.getElementById('menuOverlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');

    function toggleMenu() {
      const active = sideMenu.classList.toggle('active');
      menuOverlay.style.display = active ? 'block' : 'none';
    }

    hamburgerBtn.addEventListener('click', toggleMenu);
    menuOverlay.addEventListener('click', toggleMenu);

    // QR-kode
    new QRCode(document.getElementById("qrcode"), {
      text: window.location.origin + "/mobile.html",
      width: 140,
      height: 140
    });

    // Knappeevents
    document.getElementById('btnTexas').addEventListener('click', () => socket.emit('set_game_mode', 'TEXAS'));
    document.getElementById('btnOmaha').addEventListener('click', () => socket.emit('set_game_mode', 'OMAHA'));
    document.getElementById('btnStartHand').addEventListener('click', () => socket.emit('start_new_hand'));
    document.getElementById('btnNextPhase').addEventListener('click', () => socket.emit('next_phase'));

    // Hjelpefunksjon for å vise kort-farge
    function formatCard(card) {
      if (!card) return '';
      const isRed = card.includes('♥') || card.includes('♦') || card.includes('H') || card.includes('D');
      return `<span class="mini-card ${isRed ? 'red' : ''}">${card}</span>`;
    }

    // Oppdatering fra server
    socket.on('state_update', (state) => {
      const totalPlayers = state.players ? state.players.length : 0;
      document.getElementById('connectedBanner').innerText = `Tilkoblede spillere: ${totalPlayers}`;

      const mode = state.gameMode || 'IKKE VALGT';
      const phase = state.phase || 'VENTING';
      document.getElementById('statusText').innerText = `MODUS: ${mode} | FASE: ${phase}`;

      const playersList = document.getElementById('playersList');
      playersList.innerHTML = '';

      if (state.players && state.players.length > 0) {
        state.players.forEach(p => {
          const isWinner = state.winner && state.winner.name === p.name && phase === 'SHOWDOWN';
          const card = document.createElement('div');
          card.className = `player-card ${isWinner ? 'winner' : ''}`;

          let cardsHtml = '';
          if (phase === 'SHOWDOWN' && p.cards && p.cards.length > 0) {
            cardsHtml = `<div class="showdown-cards">${p.cards.map(formatCard).join('')}</div>`;
          }

          card.innerHTML = `
            <div class="name">${p.name}</div>
            <div class="info">Plass ${p.seat || 1} | Poeng: ${p.points || 1000}</div>
            <div>
              <span class="status-dot"></span>
              <span class="status-tag">INNE</span>
            </div>
            ${cardsHtml}
          `;
          playersList.appendChild(card);
        });
      }

      // Vinnerbjelke
      const winnerBanner = document.getElementById('winnerBanner');
      if (phase === 'SHOWDOWN' && state.winner) {
        winnerBanner.style.display = 'block';
        document.getElementById('winnerTitle').innerText = `🏆 Vinner: ${state.winner.name}`;
        document.getElementById('winnerHand').innerText = `Beste hånd: ${state.winner.handDescr || state.winner.hand || ''}`;
      } else {
        winnerBanner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
