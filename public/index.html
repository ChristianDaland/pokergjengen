<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Poker - Kontrollpanel</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .hamburger-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      font-size: 1.2rem;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 45px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 240px;
      z-index: 100;
      overflow: hidden;
    }

    .dropdown-menu.show { display: block; }
    .dropdown-menu a, .dropdown-menu button {
      display: block;
      width: 100%;
      padding: 12px 16px;
      color: #f8fafc;
      text-decoration: none;
      font-size: 0.95rem;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid #334155;
    }
    .dropdown-menu a:hover, .dropdown-menu button:hover { background: #334155; }

    .card-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 650px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    h1 { color: #ffd700; margin-top: 0; text-align: center; }
    h2 { color: #38bdf8; margin-top: 0; }

    button.btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn-green { background: #059669; color: white; }
    .btn-green:hover { background: #10b981; }
    .btn-blue { background: #2563eb; color: white; }
    .btn-blue:hover { background: #3b82f6; }
    .btn-red { background: #dc2626; color: white; }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      margin-top: 5px;
    }

    .player-list {
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }
    .player-item {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-dot {
      height: 10px;
      width: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .online { background-color: #22c55e; }
    .offline { background-color: #64748b; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-size: 1.2rem; font-weight: bold; color: #ffd700;">♠️ Løland Poker Control</div>
    <div style="position: relative;">
      <button class="hamburger-btn" onclick="toggleMenu()">☰ Meny</button>
      <div class="dropdown-menu" id="dropdown-menu">
        <a href="/board" target="_blank">🖥️ Åpne Bordskjerm</a>
        <button onclick="resetSession()">🔄 Nullstill Hele Spillet</button>
      </div>
    </div>
  </div>

  <!-- FASE 1: LOBBY & OPPSETT -->
  <div class="card-box" id="lobby-view">
    <h2>Fase 1: Oppsett av spillkveld</h2>
    <p style="color: #94a3b8;">Spillerne skanner QR-koden på bordskjermen (eller går til mobiladressen) for å logge inn.</p>

    <a href="/board" target="_blank" style="text-decoration: none;">
      <button class="btn btn-green" style="margin-bottom: 20px;">🖥️ Åpne Bordskjerm (For TV/Projektor)</button>
    </a>

    <label style="display:block; text-align:left; color:#cbd5e1;">Velg Spillmodus:</label>
    <select id="game-mode-select" onchange="changeGameMode()">
      <option value="OMAHA">Omaha (4 kort på hånden)</option>
      <option value="TEXAS">Texas Hold'em (2 kort på hånden)</option>
    </select>

    <h3 style="margin-top: 20px; color: #cbd5e1;">Tilkoblede spillere (<span id="player-count">0</span>):</h3>
    <ul class="player-list" id="lobby-player-list">
      <li style="color: #64748b; font-style: italic;">Ingen spillere tilkoblet ennå...</li>
    </ul>

    <button class="btn btn-blue" onclick="startSession()">▶ Start Spillet (Trekk plasser)</button>
  </div>

  <!-- FASE 2: SPILLEKONTROLL -->
  <div class="card-box" id="game-view" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2>Fase 2: Pågående Spill</h2>
      <span id="current-phase-badge" style="background: #334155; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 0.9rem;">VENTING</span>
    </div>

    <div style="margin: 15px 0;">
      <button class="btn btn-green" onclick="nextPhase()" id="next-phase-btn">▶ Neste Fase (Flop / Turn / River)</button>
      <button class="btn btn-blue" onclick="startNewHand()" style="margin-top: 10px;">🃏 Gi Nye Hender (Ny runde)</button>
    </div>

    <h3 style="margin-top: 20px; color: #cbd5e1;">Spillere rundt bordet:</h3>
    <ul class="player-list" id="game-player-list"></ul>
  </div>

  <script>
    const socket = io();

    function toggleMenu() {
      document.getElementById('dropdown-menu').classList.toggle('show');
    }

    function changeGameMode() {
      const mode = document.getElementById('game-mode-select').value;
      socket.emit('set_game_mode', mode);
    }

    function startSession() {
      const mode = document.getElementById('game-mode-select').value;
      socket.emit('start_session', { hostName: 'Odd Christian', gameMode: mode });
    }

    function resetSession() {
      if (confirm("Er du sikker på at du vil nullstille hele sesjonen? All data slettes.")) {
        socket.emit('reset_session');
      }
    }

    function startNewHand() {
      socket.emit('start_new_hand');
    }

    function nextPhase() {
      socket.emit('next_phase');
    }

    socket.on('state_update', (state) => {
      const lobbyView = document.getElementById('lobby-view');
      const gameView = document.getElementById('game-view');

      if (state.sessionStarted) {
        lobbyView.style.display = 'none';
        gameView.style.display = 'block';
      } else {
        lobbyView.style.display = 'block';
        gameView.style.display = 'none';
      }

      // Oppdater Lobby Spillere
      const lobbyList = document.getElementById('lobby-player-list');
      document.getElementById('player-count').innerText = state.players.length;

      if (state.players.length > 0) {
        lobbyList.innerHTML = state.players.map(p => `
          <li class="player-item">
            <span><strong>${p.name}</strong></span>
            <span class="status-dot ${p.connected ? 'online' : 'offline'}"></span>
          </li>
        `).join('');
      } else {
        lobbyList.innerHTML = `<li style="color: #64748b; font-style: italic;">Ingen spillere tilkoblet ennå...</li>`;
      }

      // Oppdater Spill-fase & Spilleliste
      document.getElementById('current-phase-badge').innerText = state.phase;
      const gameList = document.getElementById('game-player-list');
      gameList.innerHTML = state.players.map(p => `
        <li class="player-item">
          <div>
            <strong>Sete ${p.seat}: ${p.name}</strong> 
            ${p.role ? `<span style="color:#ffd700; font-size:0.85rem;">(${p.role})</span>` : ''}
          </div>
          <span style="font-size:0.85rem; color:${p.folded ? '#ef4444' : '#22c55e'};">
            ${p.folded ? 'Kastet' : 'Med'}
          </span>
        </li>
      `).join('');
    });
  </script>
</body>
</html>
