<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker - Vertskontroll</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background-color: #081c15;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .panel {
      background: #1b4332;
      border: 2px solid #52b788;
      border-radius: 12px;
      padding: 20px;
    }

    h2 { margin-top: 0; color: #74c69d; }

    .btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      color: white;
    }

    .btn-action { background: #2d6a4f; }
    .btn-action:hover { background: #40916c; }
    
    .btn-next { background: #2196f3; }
    .btn-next:hover { background: #1e88e5; }

    .btn-secondary { background: #52b788; color: #081c15; }
    .btn-danger { background: #d9534f; }

    .cards-display {
      display: flex;
      gap: 10px;
      margin: 15px 0;
      min-height: 80px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 8px;
    }

    .players-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .player-card {
      background: #081c15;
      border: 1px solid #52b788;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .qr-container {
      text-align: center;
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .qr-container img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <h1>Løland Gård Poker</h1>

  <div class="container">
    
    <!-- Hovedområde for Spillet -->
    <div class="panel">
      <h2>Spillkontroll</h2>
      <div>
        Status: <b id="game-phase" style="color: #ffd700;">VENTING</b> | 
        Modus: <b id="game-mode">Texas Hold'em</b>
      </div>

      <div style="margin-top: 20px;">
        <h3>Felleskort på bordet:</h3>
        <div id="board-cards" class="cards-display"></div>
      </div>

      <div style="margin-top: 20px;">
        <h3>Tilkoblede Spillere (<span id="player-count">0</span>):</h3>
        <div id="players-list" class="players-list"></div>
      </div>
    </div>

    <!-- Høyremeny / Knapper -->
    <div class="panel">
      <h2>Handlinger</h2>

      <div class="qr-container">
        <p style="color: black; margin: 0 0 5px 0; font-weight: bold; font-size: 0.8rem;">Skann for å bli med:</p>
        <img id="qr-code" src="" alt="QR-kode">
      </div>

      <!-- Dynamisk Spillknapp -->
      <button id="main-action-btn" class="btn btn-action" onclick="handleMainAction()">Ny Runde</button>
      
      <button class="btn btn-secondary" onclick="window.open('/board.html', '_blank')">🖥️ Åpne Bordskjerm</button>
      <button class="btn btn-secondary" onclick="toggleMode()">Bytt Modus (Texas / Omaha)</button>
      <button class="btn btn-danger" onclick="resetGame()" style="margin-top: 20px;">Nullstill Spill</button>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentPhase = 'VENTING';

    // Generer QR-kode som peker til mobil-siden
    const mobileUrl = `${window.location.origin}/mobile.html`;
    document.getElementById('qr-code').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(mobileUrl)}`;

    socket.on('game_state', (state) => {
      currentPhase = state.phase || 'VENTING';
      document.getElementById('game-phase').innerText = currentPhase;
      document.getElementById('game-mode').innerText = state.mode || "Texas Hold'em";

      // Oppdater Felleskort
      const boardCards = document.getElementById('board-cards');
      if (state.communityCards && state.communityCards.length > 0) {
        boardCards.innerHTML = state.communityCards.map(c => `<div style="background: white; color: black; padding: 10px 15px; border-radius: 4px; font-weight: bold;">${c}</div>`).join('');
      } else {
        boardCards.innerHTML = '<span style="color: #aaa; font-style: italic;">Ingen kort på bordet enda.</span>';
      }

      // Oppdater Knappe-tekst og farge basert på fase
      const btn = document.getElementById('main-action-btn');
      if (currentPhase === 'VENTING' || currentPhase === 'RIVER') {
        btn.innerText = 'Ny Runde (Del Ut)';
        btn.className = 'btn btn-action';
      } else if (currentPhase === 'PREFLOP') {
        btn.innerText = 'Åpne Flop (3 kort)';
        btn.className = 'btn btn-next';
      } else if (currentPhase === 'FLOP') {
        btn.innerText = 'Åpne Turn (4. kort)';
        btn.className = 'btn btn-next';
      } else if (currentPhase === 'TURN') {
        btn.innerText = 'Åpne River (5. kort)';
        btn.className = 'btn btn-next';
      }
    });

    socket.on('players_updated', (players) => {
      document.getElementById('player-count').innerText = players.length;
      const list = document.getElementById('players-list');
      list.innerHTML = players.map(p => `
        <div class="player-card">
          <div style="font-weight: bold;">${p.name}</div>
          <div style="color: #ffd700; font-size: 0.85rem;">Poeng: ${p.points || 0}</div>
        </div>
      `).join('');
    });

    function handleMainAction() {
      if (currentPhase === 'VENTING' || currentPhase === 'RIVER') {
        socket.emit('start_next_round');
      } else {
        socket.emit('next_phase');
      }
    }

    function toggleMode() {
      socket.emit('toggle_game_mode');
    }

    function resetGame() {
      if (confirm('Er du sikker på at du vil nullstille spillet?')) {
        socket.emit('reset_game');
      }
    }
  </script>
</body>
</html>
