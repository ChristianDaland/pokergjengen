<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Løland Gård Poker – Vertsdashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #081c15; color: white; margin: 0; padding: 20px; }
    
    .hamburger-btn { position: fixed; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; z-index: 1000; background: none; border: none; color: white; }
    .side-menu { position: fixed; top: 0; right: -350px; width: 320px; height: 100%; background: #1b4332; border-left: 3px solid #52b788; padding: 20px; transition: 0.3s; z-index: 999; }
    .side-menu.open { right: 0; }
    .side-menu button, .side-menu a { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: #2d6a4f; color: white; border: none; border-radius: 6px; cursor: pointer; text-align: left; text-decoration: none; box-sizing: border-box; }

    .container { max-width: 900px; margin: 0 auto; background: #1b4332; border: 2px solid #52b788; border-radius: 12px; padding: 25px; }
    
    .player-add-box { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
    .player-add-box input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #52b788; background: #081c15; color: white; }
    .btn-add { background: #52b788; color: #081c15; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }

    .switch-row { display: flex; justify-content: space-between; align-items: center; background: #081c15; padding: 12px; margin-bottom: 10px; border-radius: 8px; }
    .switch { position: relative; display: inline-block; width: 60px; height: 30px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d9534f; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #52b788; }
    input:checked + .slider:before { transform: translateX(30px); }

    .btn-main { background: #52b788; color: #081c15; font-weight: bold; font-size: 1.2rem; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    .btn-board { background: #ff9f1c; color: #081c15; font-weight: bold; text-align: center; display: block; padding: 12px; border-radius: 8px; text-decoration: none; margin-top: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <button class="hamburger-btn" onclick="toggleMenu()">≡</button>

  <div id="side-menu" class="side-menu">
    <h2>Meny</h2>
    <a href="/board.html" target="_blank">📺 Åpne Storskjerm / Bordvisning</a>
    <a href="/mobile.html" target="_blank">📱 Åpne Mobilvisning</a>
    <button onclick="alert('Viser Topp 10...')">📊 Topp 10-lister</button>
    <button onclick="alert('Viser dagbok...')">📝 Kveldsnotater / Dagbok</button>
    <button onclick="exportCSV()">📥 Eksporter CSV til Excel</button>
    <button onclick="alert('Viser arkiv...')">📜 Historisk Arkiv</button>
  </div>

  <div class="container">
    <h1>Løland Gård Poker</h1>

    <!-- PRE-GAME SETUP -->
    <div id="phase-pregame">
      <h2>1. Pre-Game Setup</h2>
      <label>Kveldens Vert (Host):</label>
      <select id="host-select" style="width: 100%; padding: 10px; margin: 10px 0;">
        <option value="Kai">Kai</option>
        <option value="Ronny">Ronny</option>
        <option value="Einar">Einar</option>
        <option value="Joakim">Joakim</option>
        <option value="Odd Christian" selected>Odd Christian</option>
      </select>

      <h3>Deltakere til stede:</h3>
      <div id="present-checkboxes">
        <!-- Genereres dynamisk -->
      </div>

      <div class="player-add-box">
        <input type="text" id="new-player-name" placeholder="Legg til ny/gjest espiller...">
        <button class="btn-add" onclick="addNewPlayer()">+ Legg til</button>
      </div>

      <h3 style="margin-top: 15px;">Modus:</h3>
      <select id="mode-select" style="width: 100%; padding: 10px;">
        <option value="Texas Hold'em">Texas Hold'em</option>
        <option value="Omaha">Omaha</option>
      </select>

      <h3>Dagbok / Kveldsnotater:</h3>
      <textarea id="notes-text" style="width: 100%; height: 80px;" placeholder="Skriv notater for kvelden..."></textarea>

      <button class="btn-main" onclick="startSpillekveld()">🚀 Start Spillekveld</button>
    </div>

    <!-- ACTIVE GAME -->
    <div id="phase-active" class="hidden">
      <h2>Omgang <span id="round-num">1</span> – Utslåingsbrytere</h2>
      <p style="color: #aaa;">Grønn = Aktiv i omgangen | Rød = Utslått</p>
      
      <div id="switches-container"></div>

      <button class="btn-main" style="background: #2196f3; color: white;" onclick="nextCommunityCard()">🃏 Åpne neste kort på bordet</button>
      <a href="/board.html" target="_blank" class="btn-board">📺 Åpne Storskjerm (Bordvisning) i nytt vindu</a>
    </div>

    <!-- POST-ROUND -->
    <div id="phase-post" class="hidden">
      <h2>🏆 Omgang Fullført!</h2>
      <div id="round-results"></div>
      <button class="btn-main" onclick="nextRound()">Neste Omgang ➡️</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let playerList = ['Kai', 'Ronny', 'Einar', 'Joakim', 'Odd Christian'];

    function renderPlayerCheckboxes() {
      const container = document.getElementById('present-checkboxes');
      container.innerHTML = playerList.map(name => `
        <label style="display: block; margin-bottom: 5px;">
          <input type="checkbox" value="${name}" checked> ${name}
        </label>
      `).join('');
    }

    function addNewPlayer() {
      const input = document.getElementById('new-player-name');
      const name = input.value.trim();
      if (name && !playerList.includes(name)) {
        playerList.push(name);
        renderPlayerCheckboxes();
        input.value = '';
      }
    }

    renderPlayerCheckboxes();

    function toggleMenu() {
      document.getElementById('side-menu').classList.toggle('open');
    }

    function startSpillekveld() {
      const host = document.getElementById('host-select').value;
      const mode = document.getElementById('mode-select').value;
      const notes = document.getElementById('notes-text').value;
      const checkboxes = document.querySelectorAll('#present-checkboxes input:checked');
      const presentPlayers = Array.from(checkboxes).map(cb => cb.value);

      socket.emit('setup_session', { host, mode, presentPlayers, notes });
      socket.emit('start_spillekveld');
    }

    function togglePlayer(name) {
      socket.emit('toggle_player_status', name);
    }

    function nextCommunityCard() {
      socket.emit('next_community_card');
    }

    function nextRound() {
      socket.emit('next_round');
    }

    function exportCSV() {
      socket.emit('export_csv');
    }

    socket.on('csv_data', (csv) => {
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'loland_poker_historikk.csv');
      a.click();
    });

    socket.on('session_update', (session) => {
      document.getElementById('phase-pregame').classList.add('hidden');
      document.getElementById('phase-active').classList.add('hidden');
      document.getElementById('phase-post').classList.add('hidden');

      if (session.phase === 'PRE_GAME') {
        document.getElementById('phase-pregame').classList.remove('hidden');
      } else if (session.phase === 'ACTIVE_GAME') {
        document.getElementById('phase-active').classList.remove('hidden');
        document.getElementById('round-num').innerText = session.round;
      } else if (session.phase === 'POST_ROUND') {
        document.getElementById('phase-post').classList.remove('hidden');
      }
    });

    socket.on('game_state', (state) => {
      const container = document.getElementById('switches-container');
      container.innerHTML = state.players.map(p => `
        <div class="switch-row">
          <span style="font-size: 1.2rem; font-weight: bold;">${p.name}</span>
          <label class="switch">
            <input type="checkbox" ${!p.eliminated ? 'checked' : ''} onchange="togglePlayer('${p.name}')">
            <span class="slider"></span>
          </label>
        </div>
      `).join('');

      const res = document.getElementById('round-results');
      res.innerHTML = state.players.map(p => `
        <div style="padding: 8px; border-bottom: 1px solid #52b788;">
          <b>${p.rank || '-'}. plass:</b> ${p.name} (+${p.points}p) – Totalt: ${p.totalPoints}p
        </div>
      `).join('');
    });
  </script>
</body>
</html>
